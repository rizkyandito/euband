<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coping — Euband</title>
<link rel="stylesheet" href="./css/euband.css" />
<style>
  /* ===== Step 1: Level selector ===== */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 900px) { .level-grid { grid-template-columns: 1fr; } }

  .level-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 28px 22px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .level-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.08);
  }
  .level-card.normal:hover { border-color: #10b981; }
  .level-card.sedang:hover { border-color: #f59e0b; }
  .level-card.tinggi:hover { border-color: #ef4444; }

  /* Strip warna di atas card */
  .level-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 6px;
  }
  .level-card.normal::before { background: #10b981; }
  .level-card.sedang::before { background: #f59e0b; }
  .level-card.tinggi::before { background: #ef4444; }

  .level-emoji { font-size: 56px; margin: 10px 0 10px; line-height: 1; }
  .level-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .level-title.normal { color: #047857; }
  .level-title.sedang { color: #b45309; }
  .level-title.tinggi { color: #b91c1c; }

  .level-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
    margin-bottom: 16px;
    min-height: 60px;
  }
  .level-cta {
    display: inline-block;
    padding: 8px 16px;
    background: #f3f4f6;
    color: var(--text);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    transition: background .15s ease;
  }
  .level-card:hover .level-cta {
    background: var(--blue); color: white;
  }
  .level-card .strategy-count {
    color: var(--muted2);
    font-size: 11px;
    margin-bottom: 14px;
  }

  /* Highlight kalau sesuai sesi aktif */
  .level-card.active-session {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .session-badge {
    position: absolute;
    top: 14px; right: 14px;
    background: var(--blue);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ===== Step 2: Strategy list ===== */
  .strategy-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--blue);
    font-size: 13px; font-weight: 600;
    cursor: pointer; margin-bottom: 16px;
    padding: 6px 12px;
    border-radius: 8px;
    transition: background .15s ease;
    background: transparent;
    border: 1px solid transparent;
  }
  .strategy-back:hover { background: #eff6ff; }

  .strategy-header {
    display: flex; align-items: center; gap: 16px;
    padding: 20px 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 20px;
    border-left: 6px solid;
  }
  .strategy-header.normal { border-left-color: #10b981; }
  .strategy-header.sedang { border-left-color: #f59e0b; }
  .strategy-header.tinggi { border-left-color: #ef4444; }
  .strategy-header-emoji { font-size: 36px; }
  .strategy-header h2 { margin: 0 0 4px; font-size: 20px; color: var(--text); }
  .strategy-header p  { margin: 0; color: var(--muted); font-size: 13px; }

  .strategy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }

  /* Emergency banner — khusus level Tinggi */
  .emergency-banner {
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
    border: 2px solid #ef4444;
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .emergency-icon {
    font-size: 40px;
    line-height: 1;
    flex-shrink: 0;
  }
  .emergency-content { flex-grow: 1; }
  .emergency-title {
    color: #991b1b;
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .emergency-text {
    color: #7f1d1d;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 14px;
  }
  .emergency-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .emergency-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .emergency-btn.primary {
    background: #ef4444;
    color: white;
    box-shadow: 0 2px 8px rgba(239,68,68,0.3);
  }
  .emergency-btn.primary:hover {
    background: #dc2626;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(239,68,68,0.4);
  }
  .emergency-btn.secondary {
    background: white;
    color: #991b1b;
    border: 1.5px solid #ef4444;
  }
  .emergency-btn.secondary:hover {
    background: #fef2f2;
    transform: translateY(-1px);
  }
  .emergency-divider {
    margin: 6px 0 14px;
    padding: 8px 0;
    border-top: 1px dashed #94a3b8;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .strategy-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .strategy-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  }

  .strategy-num {
    display: inline-block;
    width: 26px; height: 26px;
    line-height: 26px;
    background: #f3f4f6;
    color: var(--text);
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
  }
  .strategy-card.normal .strategy-num { background: #d1fae5; color: #047857; }
  .strategy-card.sedang .strategy-num { background: #fef3c7; color: #b45309; }
  .strategy-card.tinggi .strategy-num { background: #fee2e2; color: #b91c1c; }

  .strategy-name {
    font-size: 16px; font-weight: 700;
    color: var(--text); margin-bottom: 10px;
  }
  .strategy-recommend {
    background: #f9fafb;
    border-left: 3px solid var(--blue);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: #1f2937;
    line-height: 1.55;
    font-style: italic;
    margin-bottom: 12px;
  }
  .strategy-ref {
    font-size: 11px;
    color: var(--muted);
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .strategy-ref strong { color: var(--text); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-name">EUBAND</div>
    <div class="brand-sub">Sistem Deteksi Stres</div>
  </div>
  <nav class="nav">
    <a class="nav-item" href="./dashboard.html"><span class="nav-ic">⬚</span>Dashboard</a>
    <a class="nav-item active" href="./coping.html"><span class="nav-ic">✦</span>Coping</a>
    <a class="nav-item" href="https://studentaffairs.telkomuniversity.ac.id/konseling/" target="_blank" rel="noopener"><span class="nav-ic">○</span>Konseling</a>
    <a class="nav-item" href="./pengaturan.html"><span class="nav-ic">⚙</span>Pengaturan</a>
    <a class="nav-item" href="./privasi.html"><span class="nav-ic">○</span>Privasi &amp; Data</a>
  </nav>
  <div class="user-card">
    <div class="user-avatar">E</div>
    <div>
      <div class="user-name">Euband</div>
      <div class="user-role">Alat Pemantau Stres</div>
    </div>
  </div>
</aside>

<main class="main">
  <header class="header">
    <div>
      <h1 class="title" id="pageTitle">Strategi Coping</h1>
      <p class="subtitle" id="pageSubtitle">Pilih tingkat stres untuk lihat cara mengatasinya</p>
    </div>
  </header>

  <!-- Container utama: di-swap antara level selector & strategy list -->
  <div id="copingContainer"></div>
</main>

<script>
  // ============================================================
  // Data strategi coping (dari coping.txt, 3 tingkat stress)
  // ============================================================
  const COPING_DATA = {
    normal: {
      title: 'Stres Normal',
      emoji: '🌿',
      desc: 'Kondisi tubuh kamu baik. Pertahankan & cegah stres naik dengan langkah pencegahan.',
      subtitle: 'Strategi pemeliharaan & pencegahan stres',
      strategies: [
        {
          name: 'Sadari Momen Sekarang (Mindfulness)',
          recommend: 'Ambil 2 menit untuk pernapasan sadar.',
          ref: 'Khoury et al., 2015 — Mindfulness',
        },
        {
          name: 'Aktivitas Fisik Ringan',
          recommend: 'Jalan kaki atau peregangan 5 menit.',
          ref: 'Zhang et al., 2021 — Front Public Health',
        },
        {
          name: 'Journaling Positif',
          recommend: 'Tulis satu hal yang kamu syukuri hari ini.',
          ref: 'Smyth et al., 2018 — JMIR Mental Health',
        },
        {
          name: 'Lihat Sisi Positifnya (Positive Reappraisal)',
          recommend: 'Ubah tantangan jadi peluang belajar.',
          ref: 'Garland et al., 2011 — Anxiety Stress Coping',
        },
        {
          name: 'Koneksi Sosial',
          recommend: 'Sapa teman atau keluarga hari ini.',
          ref: 'Nguyen et al., 2024 — PLOS One',
        },
      ],
    },
    sedang: {
      title: 'Stres Sedang',
      emoji: '⚠️',
      desc: 'Stres sedang terdeteksi. Atasi dengan cara mengatur emosi dan mengubah pikiran negatif.',
      subtitle: 'Strategi regulasi & pemecahan masalah',
      strategies: [
        {
          name: 'Mengubah Pola Pikir Negatif (Cognitive Restructuring / CBT)',
          recommend: 'Coba tantang pikiran negatif dengan fakta.',
          ref: 'Borkovec et al., 2002 — Clinical Psychological Science Practice',
        },
        {
          name: 'Fokus Mencari Solusi (Problem-Focused Coping)',
          recommend: 'Buat daftar solusi untuk masalah yang dihadapi.',
          ref: 'Kim et al., 2024 — Psychiatry Investigation',
        },
        {
          name: 'Relaksasi Otot Bertahap (PMR)',
          recommend: 'Coba relaksasi otot: tegangkan lalu rilekskan otot.',
          ref: 'Lehrer & Woolfolk, 2021 — Stress Management',
        },
        {
          name: 'Pernapasan Dalam',
          recommend: 'Tarik napas dalam, hembuskan perlahan selama 1 menit.',
          ref: 'Sadeghi et al., 2024 — Complementary Therapies in Medicine',
        },
        {
          name: 'Dukungan Sosial',
          recommend: 'Hubungi teman/keluarga untuk berbagi cerita.',
          ref: 'Araya et al., 2024 — Psychological Medicine',
        },
        {
          name: 'Menetapkan Target (Goal Setting)',
          recommend: 'Tentukan target kecil dan rayakan pencapaiannya.',
          ref: 'Borkovec et al., 2002 — Clinical Psychological Science Practice',
        },
      ],
    },
    tinggi: {
      title: 'Stres Tinggi',
      emoji: '🚨',
      desc: 'Stres tinggi terdeteksi. Disarankan hubungi konselor profesional — strategi mandiri sebagai pendukung.',
      subtitle: 'Segera hubungi konselor + cara cepat menenangkan diri',
      strategies: [
        {
          name: 'Teknik Menenangkan Diri 5-4-3-2-1 (Grounding)',
          recommend: 'Coba teknik grounding: sebut 5 hal yang kamu lihat, 4 yang kamu rasakan, 3 yang kamu dengar, 2 yang kamu cium, dan 1 yang kamu rasakan.',
          ref: 'Trauma-Informed Care Guidelines',
        },
        {
          name: 'Panduan Relaksasi / Meditasi (Guided Relaxation / Mindfulness)',
          recommend: 'Ikuti panduan relaksasi atau meditasi singkat.',
          ref: 'Kabat-Zinn et al., 2016 — Mindfulness-Based Stress Reduction',
        },
        {
          name: 'Latihan Napas Darurat (Emergency Breathing Protocols)',
          recommend: 'Tarik napas perlahan, tahan, lalu hembuskan perlahan.',
          ref: 'Sadeghi et al., 2024 — Complementary Therapies in Medicine',
        },
        {
          name: 'Aktivasi Dukungan Sosial',
          recommend: 'Segera hubungi orang yang kamu percaya.',
          ref: 'Araya et al., 2024 — Psychological Medicine',
        },
        {
          name: 'Rujukan ke Profesional (Referral to Professional)',
          recommend: 'Jika stres berat berlanjut, segera konsultasi dengan profesional.',
          ref: 'WHO Mental Health Guidelines',
        },
        {
          name: 'Gerakan Ringan / Peregangan (Gentle Movement / Stretching)',
          recommend: 'Lakukan peregangan ringan untuk meredakan ketegangan.',
          ref: 'Smith, 2001 — Perceptual and Motor Skills',
        },
      ],
    },
  };

  // ============================================================
  // Detect level sesi aktif dari sessionStorage (kalau ada)
  // ============================================================
  function getActiveSessionLevel() {
    try {
      const raw = sessionStorage.getItem('euband.session.v1');
      if (!raw) return null;
      const data = JSON.parse(raw);
      const level = data?.lastResult?.level;
      if (!level) return null;
      return level.toLowerCase();   // 'normal' | 'sedang' | 'tinggi'
    } catch { return null; }
  }

  // ============================================================
  // Render: Step 1 (level selector)
  // ============================================================
  function renderLevelSelector() {
    document.getElementById('pageTitle').textContent = 'Strategi Coping';
    document.getElementById('pageSubtitle').textContent =
      'Pilih tingkat stres untuk lihat rekomendasi strategi yang sesuai';

    const activeLevel = getActiveSessionLevel();
    const container = document.getElementById('copingContainer');

    const levelInfo = activeLevel
      ? `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#1e40af;">
           💡 Sesi aktif terdeteksi dengan tingkat <strong>${activeLevel.toUpperCase()}</strong> —
           direkomendasikan strategi untuk level tersebut (ditandai).
         </div>`
      : '';

    const cards = ['normal', 'sedang', 'tinggi'].map(key => {
      const data = COPING_DATA[key];
      const isActive = activeLevel === key;
      return `
        <div class="level-card ${key} ${isActive ? 'active-session' : ''}" data-level="${key}">
          ${isActive ? '<div class="session-badge">Sesi Anda</div>' : ''}
          <div class="level-emoji">${data.emoji}</div>
          <div class="level-title ${key}">${data.title}</div>
          <div class="level-desc">${data.desc}</div>
          <div class="strategy-count">${data.strategies.length} strategi</div>
          <div class="level-cta">Lihat Strategi →</div>
        </div>
      `;
    }).join('');

    container.innerHTML = levelInfo + `<section class="level-grid">${cards}</section>`;

    // Wire klik card
    container.querySelectorAll('.level-card').forEach(card => {
      card.addEventListener('click', () => {
        const level = card.dataset.level;
        renderStrategyList(level);
      });
    });
  }

  // ============================================================
  // Render: Step 2 (strategy detail per level)
  // ============================================================
  function renderStrategyList(level) {
    const data = COPING_DATA[level];
    if (!data) return;

    document.getElementById('pageTitle').textContent = data.title;
    document.getElementById('pageSubtitle').textContent = data.subtitle;

    const container = document.getElementById('copingContainer');

    const strategies = data.strategies.map((s, i) => `
      <div class="strategy-card ${level}">
        <div class="strategy-num">${i + 1}</div>
        <div class="strategy-name">${escapeHtml(s.name)}</div>
        <div class="strategy-recommend">"${escapeHtml(s.recommend)}"</div>
        <div class="strategy-ref"><strong>Referensi:</strong> ${escapeHtml(s.ref)}</div>
      </div>
    `).join('');

    // Emergency banner — hanya tampil untuk level Tinggi
    const emergencyBanner = (level === 'tinggi') ? `
      <div class="emergency-banner">
        <div class="emergency-icon">🚨</div>
        <div class="emergency-content">
          <p class="emergency-title">Stres Tinggi Terdeteksi — Segera Hubungi Konselor</p>
          <p class="emergency-text">
            Untuk tingkat stres tinggi, sangat disarankan menghubungi <strong>layanan
            konseling profesional</strong> dibanding hanya mengandalkan strategi mandiri.
            Konselor terlatih dapat membantu menangani stres berat dengan pendekatan
            klinis yang tepat.
          </p>
          <div class="emergency-actions">
            <a href="tel:+6282130155601" class="emergency-btn primary">
              📞 Hubungi: +62 821-3015-5601
            </a>
            <a href="https://studentaffairs.telkomuniversity.ac.id/konseling/"
               target="_blank" rel="noopener" class="emergency-btn secondary">
              🌐 Website Konseling Telkom
            </a>
          </div>
        </div>
      </div>
      <div class="emergency-divider">Atau coba strategi mandiri berikut sambil menunggu</div>
    ` : '';

    container.innerHTML = `
      <button class="strategy-back" id="btnBack">← Kembali pilih tingkat</button>
      <div class="strategy-header ${level}">
        <div class="strategy-header-emoji">${data.emoji}</div>
        <div>
          <h2>${data.title}</h2>
          <p>${data.subtitle} · ${data.strategies.length} strategi berbasis bukti ilmiah</p>
        </div>
      </div>
      ${emergencyBanner}
      <section class="strategy-grid">${strategies}</section>
    `;

    document.getElementById('btnBack').addEventListener('click', renderLevelSelector);

    // Scroll ke atas
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============================================================
  // Helpers
  // ============================================================
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ============================================================
  // Init — kalau URL ada ?level=xxx, langsung ke detail
  // ============================================================
  const urlLevel = new URLSearchParams(location.search).get('level');
  if (urlLevel && COPING_DATA[urlLevel.toLowerCase()]) {
    renderStrategyList(urlLevel.toLowerCase());
  } else {
    renderLevelSelector();
  }
</script>
</body>
</html>
