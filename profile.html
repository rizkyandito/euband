<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil — Euband</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/theme.js"></script>
</head>
<body>
  <div style="max-width: 480px; margin: 80px auto; padding: 24px;">
    <h1 style="font-size: 28px; margin-bottom: 16px;">Profil</h1>
    <div id="userInfo" style="background: #1a1f2e; padding: 16px; border-radius: 12px; margin-bottom: 24px;">
      <div style="color: #94a3b8; font-size: 12px;">Username</div>
      <div id="userUsername" style="font-size: 16px; margin-bottom: 12px;">—</div>
      <div style="color: #94a3b8; font-size: 12px;">Nama</div>
      <div id="userName" style="font-size: 16px;">—</div>
    </div>
    <button id="btnLogout" class="btn btn-danger" style="width: 100%; margin-bottom: 12px;">Logout</button>
    <a href="./dashboard.html" class="btn btn-success" style="width: 100%; display: block; text-align: center;">← Dashboard</a>
  </div>
  <script>
    (async () => {
      if (!(await window.auth.requireAuth())) return;
      const u = window.auth.getUser();
      if (u) {
        document.getElementById('userUsername').textContent = u.username || '—';
        document.getElementById('userName').textContent     = u.full_name || '—';
      }
      document.getElementById('btnLogout').addEventListener('click', () => {
        window.auth.signOut();
      });
    })();
  </script>
</body>
</html>
